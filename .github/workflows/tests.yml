name: verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m qaf.preflight --no-git
      - run: python -m pytest -q -p no:cacheprovider --basetemp "$env:RUNNER_TEMP\qaf-pytest"
