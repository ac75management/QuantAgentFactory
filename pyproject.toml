[project]
name = "quantagentfactory"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "tzdata"]

[project.optional-dependencies]
mt5 = ["MetaTrader5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Sin .pytest_cache: varios agentes corren pytest a la vez sobre OneDrive.
addopts = "-p no:cacheprovider"
